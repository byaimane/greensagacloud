version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*.apk'
      headers:
        - key: Content-Type
          value: application/vnd.android.package-archive
        - key: Content-Disposition
          value: attachment; filename="GreenSAGA-v2.6.0.apk"
